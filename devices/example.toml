# Copy to devices/<kid>.toml and edit.
device_name = "Muzak"
state_dir = "/var/lib/muzak"
audio_backend = "alsa"
# Headphone jack:
audio_device = "plughw:CARD=Headphones"
# Bluetooth speaker instead (pair it first, see the Task 14 checklist):
# audio_device = "bluealsa:DEV=AA:BB:CC:DD:EE:FF,PROFILE=a2dp"
# bluetooth_speaker = "AA:BB:CC:DD:EE:FF"
initial_volume = 60
dim_after_secs = 180
off_after_secs = 600
# Audiobooks from an Audiobookshelf server turns Books on. Sign in from Settings on the player.
# audiobookshelf_url = "http://nas.local:13378"
# Voice control: say the wake word, then a request. Needs a USB microphone and the keyword model:
#   curl -sSL https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2 | tar xj -C /var/lib/muzak
# voice_model_dir = "/var/lib/muzak/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01"
# gemini_api_key = "…"            # or GEMINI_API_KEY in the environment
# vertex_key_file = "/var/lib/muzak/vertex-key.json"  # Google Cloud service account: uses Vertex AI and Cloud credits instead
# vertex_location = "global"
# wake_phrase = "ziggy"           # "hey muzak" wakes more readily but also on "hey music"
# wake_threshold = 0.25           # lower wakes more readily
# microphone = "USB"              # part of the microphone's name; the default input otherwise
# gemini_model = "gemini-3.5-flash-lite"
